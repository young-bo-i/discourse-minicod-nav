zh_CN:
  minicod_nav:
    title: "Minicodhook"
  site_settings:
    minicodnav_plugin_enabled: "启用来自 openscholay 资源中台的 Minicodhook 同步。"
    minicodnav_webhook_secret_pavlovia: "Pavlovia 来源 webhook 的 HMAC 共享密钥;同时作为拉取 Pavlovia snapshot 时的 Bearer Token。"
    minicodnav_webhook_secret_journal: "学术底刊来源 webhook 的 HMAC 共享密钥;同时作为拉取学术底刊 snapshot 时的 Bearer Token。"
    minicodnav_openscholay_base_url: "openscholay 上游主机地址(如 https://www.minicod.com)。冷启动 / 灾备时 GET /api/nav/snapshot/:source 使用。"
    minicodnav_upstream_ip_allowlist: "受信任的上游 IP / CIDR 列表(逗号分隔)。来自这些 IP 的请求会绕过 Discourse 自身的 per-IP 限流(HMAC 验证仍然生效)。不影响 nginx 层限流 —— 那一层用 web.minicod-nav-bypass.template.yml 绕过。"
    minicodnav_pavlovia_category_id: "source_type=pavlovia 的资源在 webhook 未携带 discourse_category_id 时落到的 Discourse 分类。"
    minicodnav_journal_category_id: "source_type=journal(学术底刊)的资源在 webhook 未携带 discourse_category_id 时落到的 Discourse 分类。"
