# Discourse Docker template — bypasses nginx limit_req / limit_conn for the
# plugin's HMAC-authed webhook endpoint. Upstream Outbox bursts (hundreds of
# POSTs in a few seconds during bulk publishing) otherwise trip the global
# flood zone defined by web.ratelimited.template.yml and come back as
# nginx-rendered HTML 429.
#
# Install:
#   In containers/app.yml, add to the `templates:` list AFTER
#   web.ratelimited.template.yml (so this override is the last definition):
#
#     templates:
#       - "templates/postgres.template.yml"
#       - "templates/redis.template.yml"
#       - "templates/web.template.yml"
#       - "templates/web.ratelimited.template.yml"
#       - "templates/web.minicod-nav-bypass.template.yml"   # <-- add this
#
#   Discourse Docker resolves bare "templates/..." paths against the plugin's
#   own directory once the plugin is cloned into /var/discourse/plugins; if
#   your setup needs an absolute path use:
#       - "$home/plugins/discourse-minicod-nav/templates/web.minicod-nav-bypass.template.yml"
#
#   Then: cd /var/discourse && ./launcher rebuild app
#
# Verify after rebuild:
#   curl -i -X POST https://<forum-host>/minicod-nav/webhook/pavlovia \
#        -H 'Content-Type: application/json' -d '{}'
#   Expect 401 (signature missing), NOT 429.
#
# Authentication is unchanged — every request is still HMAC-checked by the
# plugin's webhook controller. Bypassing rate limits here only removes the
# burst protection that's already provided by HMAC + delivery_id idempotency
# + the plugin's per-resource DistributedMutex.

run:
  - file:
     path: "/etc/nginx/conf.d/outlets/discourse/05-minicod-nav-bypass.conf"
     contents: |
       location ^~ /minicod-nav/webhook/ {
         limit_req off;
         limit_conn off;

         proxy_set_header Host $http_host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $remote_addr;
         proxy_set_header X-Forwarded-Proto $thescheme;
         proxy_http_version 1.1;
         proxy_pass http://discourse;
       }
